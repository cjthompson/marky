[package]
name = "marky"
version = "0.1.3"
description = "A fast markdown viewer with vault support"
authors = ["Garrett Graves"]
edition = "2021"

[lib]
name = "marky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
notify = "7"
notify-debouncer-full = "0.4"
nucleo = "0.5"
ignore = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
dirs = "5"
atomic-write-file = "0.3"
diffy = "0.5"
rumdl = "=0.2.78"
toml = "0.8"
yaml-rust2 = "0.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
